---

nginx_dir_path: "/srv/nginx"
letsencrypt_path: "/etc/letsencrypt"
certbot_webroot_path: "/var/www/certbot"

gitlab_ssl_private_key_path: "/etc/letsencrypt/live/{{ gitlab_hostname }}/privkey.pem"
gitlab_ssl_certificate_path: "/etc/letsencrypt/live/{{ gitlab_hostname }}/fullchain.pem"

rancher_ssl_private_key_path: "/etc/letsencrypt/live/{{ rancher_hostname }}/privkey.pem"
rancher_ssl_certificate_path: "/etc/letsencrypt/live/{{ rancher_hostname }}/fullchain.pem"

app_ssl_private_key_path: "/etc/letsencrypt/live/{{ app_hostname }}/privkey.pem"
app_ssl_certificate_path: "/etc/letsencrypt/live/{{ app_hostname }}/fullchain.pem"


nginx_image: "nginx:latest"
nginx_container_name: "nginx"

nginx_http_port: 80
nginx_http_container_port: 80
nginx_https_port: 443
nginx_https_container_port: 443