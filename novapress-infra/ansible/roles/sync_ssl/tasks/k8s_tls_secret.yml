---
# Crée le namespace cible si nécessaire (via kubeconfig K3s système)
- name: Ensure namespace exists for {{ item.secret_name }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.namespace }}"
    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
  run_once: true
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  become: true

# Crée ou met à jour le secret TLS dans Kubernetes depuis CP1
- name: Create/Update TLS Secret in Kubernetes for {{ item.secret_name }}
  shell: |
    k3s kubectl -n {{ item.namespace }} create secret tls {{ item.secret_name }} \
      --cert=/tmp/certs/{{ item.secret_name }}_{{ fullchain_file }} \
      --key=/tmp/certs/{{ item.secret_name }}_{{ privkey_file }} \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  run_once: true
  become: true
