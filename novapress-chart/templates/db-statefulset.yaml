---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novapress-db
  labels:
    app: novapress-db
spec:
  serviceName: "novapress-db"
  replicas: 1
  selector:
    matchLabels:
      app: novapress-db
  template:
    metadata:
      labels:
        app: novapress-db
    spec:
      nodeSelector:
        nodepool: worker
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          envFrom:
            - secretRef:
                name: novapress-db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}

